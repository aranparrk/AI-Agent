<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 단위는 절대 단위와 상대 단위로 나뉘어 짐 */
      /* 절대 단위 : px(pixel) */
      /* 상대 단위 : % 상대적인 크기, em 부모 요소의 상대적인 크기(1), rem은 html 기준의 상대적인 크기(1) */
      /* vw(view width) : 뷰포트의 너비 기준으로 상대적인 크기, vh : 뷰포트의 높이의 상대적인 크기 */
      .parent {
        font-size: 1vw;
      }
      .child {
        font-size: 2vw;
      }
      .child-to-child {
        font-size: 3vw;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <p>부모의 폰트 크기 입니다.</p>
      <div class="child">
        <p>자식의 폰트 크기 입니다.</p>
        <div class="child-to-child">
          <p>자식의 자식 폰트 크기 입니다.</p>
        </div>
      </div>
    </div>
  </body>
</html>
