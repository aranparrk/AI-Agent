<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 100px;
        height: 100px;
        background-color: red;
        transition: all 1s 0.3s; /* all : 모든 효과를 적용하겠다 */
      }
      .box:hover {
        background-color: blue;
        width: 200px;
      }
    </style>
  </head>
  <body>
    <div class="box red"></div>
  </body>
</html>
