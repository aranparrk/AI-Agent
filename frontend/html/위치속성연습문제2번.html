<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
      }
      .box {
        background-color: royalblue;
        width: 60px;
        height: 60px;
        border-radius: 15px;
        position: relative;
        box-sizing: border-box;
        margin: 20px;
      }
      .badge {
        background-color: red;
        width: 24px;
        height: 24px;
        color: white;
        text-align: center;
        align-items: center;
        border-radius: 50%;
        position: absolute;
        right: -8px;
        top: -8px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <div class="badge badge1">1</div>
      </div>
      <div class="box">
        <div class="badge badge2">2</div>
      </div>
      <div class="box">
        <div class="badge badge3">3</div>
      </div>
    </div>
  </body>
</html>
