<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* flex : 1차원 방향(가로 또는 세로)으로 레이아웃을 구성할 때 사용 */

      /* 1. flex 컨테이너와 flex 아이템 개념이 있음
        -> 부모에게 display: flex를 주면 부모가 자식 요소들을 배치함 */

      /* 2. 주축과 교차축 개념이 있음
        -> 주축 : flex 아이템이 배치되는 방향
        -> justify-content : 주축 방향 정렬
        -> align-items : 교차축 방향 정렬 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .container {
        max-width: 1024px;
        width: 100%;
        margin: 0 auto;
        background-color: #fff;
        border: 1px solid #ccc;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header {
        display: flex;
        width: 100%; /* 부모의 크기 100% */
        height: 60px;
        background-color: lightpink;
        justify-content: space-between; /* 양끝은 붙이고 사이는 균등하게 배치 */
      }

      main {
        flex-grow: 1; /* 남는 공간을 가져 감 */
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background-color: antiquewhite;
      }
      footer {
        height: 60px;
        display: flex;
        width: 100%;
        color: white;
        font-size: 14px;
        background-color: lightgreen;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div>ㅎㅇ</div>
        <div>ㅂㅇ</div>
        <div>ㅇㅇ</div>
        <div>ㅈㅅ</div>
        <div>ㅅㄱ</div>
      </header>
      <main>
        <div>text</div>
        <div>text</div>
        <div>text</div>
        <div>text</div>
      </main>
      <footer></footer>
    </div>
  </body>
</html>
