<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      body {
        font-family: Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        min-height: 100vh;
      }

      .container {
        width: 304px;
        height: 390px;
        border: 1px solid gray;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }
      .login {
        box-sizing: border-box;
        margin-top: 28px;
        width: 228px;
        height: 44px;
        font-size: 14px;
        font-weight: bold;
        color: #504444;
        border: 1px solid black;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .or {
        font-size: 16px;
        font-weight: bold;
        color: #504444;
        margin-top: 10px;
      }
      input {
        background-color: #eaeaea;
        border: none;
        width: 228px;
        height: 44px;
        margin-top: 18px;
        box-sizing: border-box;
        padding: 0 12px;
      }
      button {
        width: 228px;
        height: 44px;
        color: #ffffff;
        background-color: #373f3c;
        border: none;
        font-size: 14px;
        margin-top: 18px;
      }
      .forgot-password a {
        font-size: 14px;
        color: #2c3432;
        text-decoration: none;
      }
      .forgot-password {
        margin-top: 28px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="login">
        <i class="fa-brands fa-google"></i>Log in with Google
      </div>
      <div class="or">or</div>
      <label>
        <input type="text" name="id" placeholder="Username" />
      </label>
      <label>
        <input type="password" name="pwd" placeholder="Password" />
      </label>
      <button type="submit">LOGIN</button>
      <div class="forgot-password"><a href="">Forgot your password?</a></div>
    </div>
  </body>
</html>
