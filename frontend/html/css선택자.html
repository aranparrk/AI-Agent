<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 선택자는 스타일을 적용할 HTML요소를 지정하는 영역 */
      /* 전체 선택자 : 모든 HTML 요소에 스타일 적용 */
      /* * {
        color: red;
        box-sizing: border-box;
      } */

      /* 태그 선택자 : 특정 태그 이름을 기준으로 스타일 적용 */
      /* div {
        background-color: royalblue;
      } */

      /* 클래스 선택자 : 특정 그룹의 요소에 스타일 적용, 여러요소에 공통 적용 가능 */
      .accent {
        border: 1px solid #000;
      }

      /* 아이디 선택자 : 특정 하나의 요소에만 스타일 적용, 문서 전체에서 유일해야 함 */
      #container {
        width: 500px;
        margin: 0 auto;
        background-color: aqua;
      }

      /* 1. 전체 선택자(*) 를 사용해서 모든 요소의 font-family를 "Arial, sans-serif"로 지정하세요/ */
      * {
        font-family: Arial, sans-serif;
        box-sizing: border-box;
      }
      /* 2. 태그 선택자를 사용해서 ul의 배경색(backgorund-color)을 #f0f0f0으로, 안쪽 여백(padding)을 20px로 지정하세요. */
      ul {
        background-color: #f0f0f0;
        padding: 20px;
      }
      /* 3. 클래스 선택자(.important)를 사용해서 해당 항목의 글자색을 orange로, 글자를 굵게(font-weight : bold) 만드세요. */
      .important {
        color: orange;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>안녕하세요. 오늘은 날씨가 별로에요~~~</h1>
      <p>그래도 <span class="accent">금요일</span>이라 좋아요~~~</p>
      <p>주말에는 <span class="accent">오디세이</span>를 보러 갑니다.</p>

      <h2>이번 주 할 일</h2>
      <ul>
        <li>강의 준비하기</li>
        <li class="important">과제 채점하기</li>
        <li>주식 시황 체크하기</li>
        <li class="important">스터디 자료 정리하기</li>
      </ul>
    </div>
  </body>
</html>
