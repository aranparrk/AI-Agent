<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .order-button {
        background-color: royalblue;
        color: white;
        border: none;
        padding: 10px 20px;
      }
      .order-button:hover {
        background-color: orange;
        cursor: pointer;
      }
      .order-button:active {
        background-color: red;
      }
    </style>
  </head>
  <body>
    <button class="order-button">주문하기</button>
  </body>
</html>
