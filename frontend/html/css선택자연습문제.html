<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 1. 전체 선택자(*) 를 사용해서 모든 요소의 font-family를 "Arial, sans-serif"로 지정하세요/ */
      * {
        font-family: Arial, sans-serif;
      }
      /* 2. 태그 선택자를 사용해서 ul의 배경색(backgorund-color)을 #f0f0f0으로, 안쪽 여백(padding)을 20px로 지정하세요. */
      ul {
        background-color: #f0f0f0;
        padding: 20px;
      }
      /* 3. 클래스 선택자(.important)를 사용해서 해당 항목의 글자색을 orange로, 글자를 굵게(font-weight : bold) 만드세요. */
      .important {
        color: orange;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>이번 주 할 일</h2>
    <ul>
      <li>강의 준비하기</li>
      <li class="important">과제 채점하기</li>
      <li>주식 시황 체크하기</li>
      <li class="important">스터디 자료 정리하기</li>
    </ul>
  </body>
</html>
