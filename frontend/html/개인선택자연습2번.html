<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 선택자 복습</title>

    <style>
      /* 1. .course 바로 아래 자식인 h2만 글자색을 navy로 지정하세요. */
      .course > h2 {
        color: navy;
      }

      /* 2. .lesson 내부의 모든 span을 글자색 orange로 지정하세요.
         안쪽 div에 들어 있는 span도 적용되어야 합니다. */
      .lesson span {
        color: orange;
      }

      /* 3. .lesson 바로 아래 자식인 p만 배경색 lightgray로 지정하세요.
         안쪽 div의 p에는 적용되면 안 됩니다. */
      .lesson > p {
        background-color: lightgray;
      }

      /* 4. p 바로 다음에 붙어 있는 형제 p에 밑줄을 적용하세요. */
      .lesson > p + p {
        text-decoration: underline;
      }

      /* 5. h3 뒤에 있는 모든 형제 p의 글자를 기울이세요.
         중간에 다른 태그가 있어도 선택되어야 합니다. */
      .lesson > h3 ~ p {
        font-style: italic;
      }

      /* 6. 같은 태그 종류 중 첫 번째인 .lesson에
         테두리 2px solid blue를 적용하세요. */
      .lesson:first-of-type {
        border: 2px solid blue;
      }

      /* 7. 마지막 .lesson에 마우스를 올리면
         배경색이 lightyellow로 바뀌도록 지정하세요. */
      .course > .lesson:last-child:hover {
        background-color: lightyellow;
      }
    </style>
  </head>

  <body>
    <section class="course">
      <h2>CSS 선택자 강의</h2>

      <div class="lesson">
        <h3>1강 기본 선택자</h3>
        <p>태그 선택자</p>
        <p>클래스 선택자</p>
        <span>필수 강의</span>

        <div>
          <p>복습 자료</p>
          <span>추가 설명</span>
        </div>
      </div>

      <div class="lesson">
        <h3>2강 관계 선택자</h3>
        <p>자식 선택자</p>
        <span>중간 안내</span>
        <p>형제 선택자</p>
      </div>
    </section>
  </body>
</html>
