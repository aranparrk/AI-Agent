<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 
    아래 조건을 만족하는 버튼을 만들어 보세요.
    - 화면 오른쪽 아래 고정 (스크롤해도 위치 유지)
    - position: fixed 사용
    - 너비/높이 80px, 배경색 gold, 텍스트 “Top”
    - 위치는 right: 20px, bottom: 20px
    -->
    <style>
      button {
        width: 80px;
        height: 80px;
        background-color: gold;
        position: fixed;
        right: 20px;
        bottom: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <button>Top</button>
  </body>
</html>
