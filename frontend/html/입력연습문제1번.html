<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    label {
      display: inline-block;
      width: 60px;
    }

    div {
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <h1>예약 정보</h1>
  <form action="">
    <div>
      <label for="name">이 름</label> <input type="text" id="name" name="name">
    </div>
    <div>
      <label for="phone">휴대폰</label> <input type="tel" id="phone" name="phone">
    </div>
    <div>
      <label for="email">이메일</label> <input type="email" id="email" name="email">
    </div>
    <div>
      <button type="submit">예약하기</button>
    </div>
  </form>
</body>

</html>
