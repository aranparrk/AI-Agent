<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 조합 선택자 : 기본 선택자와 함께 사용했을 때 선택자의 의미를 더 풍부하게 해 주는 선택자 */
      /* 그룹 선택자 : 여러 선택자를 하나로 그룹 지을 때 사용. 선택자와 선택자는 ,(콤마) 기호로 구분 */
      table {
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #aaa;
        padding: 2px 4px;
      }
      /* 자식 선택자 > : 부모 요소의 하위에 있는 자식 요소에 스타일 적용 */
      /* 인접 형제 선택자 + : 바로 뒤에 오는 형제 선택 */
      /* 일반 형제 선택자 ~ : 뒤에 오는 모든 형제 선택 */
      /* 가상 요소 선택자 : 실제로는 존재하지 않는 가상의 부분에 스타일 적용 */
      .box {
        width: 400px;
        height: 400px;
        background-color: aqua;
      }
      .box > p {
        color: navy;
        font-weight: bold;
      }
      .box > div > p ~ p {
        color: red;
      }
      h1::before {
        content: "*";
        color: red;
      }
      h1::after {
        content: "*";
        color: blue;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>번호</th>
          <th>상품명</th>
          <th>수량</th>
          <th>가격</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>콜라</td>
          <td>1개</td>
          <td>1,500원</td>
        </tr>
        <tr>
          <td>2</td>
          <td>사이다</td>
          <td>2개</td>
          <td>1,000원</td>
        </tr>
        <tr>
          <td>3</td>
          <td>콜라</td>
          <td>3개</td>
          <td>1,000원</td>
        </tr>
      </tbody>
    </table>

    <p>날짜 : 2026. 08. 21(금)</p>
    <div class="box">
      <h1>걸 그룹 인기 순위</h1>
      <p>1. 리센느</p>
      <div>
        <p>2. 아이브</p>
        <p>3. 블랙핑크</p>
        <p>4. 2NE1</p>
        <div>5. 뉴진스</div>
        <p>6. 여자친구</p>
      </div>
    </div>
  </body>
</html>
