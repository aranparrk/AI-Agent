<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 외부 스타일 시트 -->
    <link rel="stylesheet" href="./css/style.css" />
    <!-- 내부 스타일 시트 : 한 페이지 전용, head 영역에 추가 -->
    <style></style>
  </head>
  <body>
    <div>
      <!-- 브라우저 기본 스타일 : 브라우저에 내장된 기본 CSS -->
      <h1>오늘의 영화 순위</h1>
      <ol>
        <!-- 인라인 스타일 : HTML 요소에 스타일을 직접 지정, 우선순위 높음, 가급적 사용하지 않음 -->
        <li style="color: aqua">스파이더맨</li>
        <li>오디세이</li>
        <li>호프</li>
      </ol>
    </div>
  </body>
</html>
