<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      width: 520px;
      border: 1px solid black;
      padding: 20px;
    }
    .info-label {
      display: inline-block;
      width: 60px;
      margin-left: 30px;
    }
    .position {
      margin-left: 30px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div>
      <div>
        <h1>프론트앤드 개발자 지원서</h1>
      </div>
      <div>
        HTML, CSS, Javascript에 대한 기술적 이해와 경험이 있는 분을 찾습니다.
      </div>
      <hr>
    </div>
    <form action="">
      <div>
        <div>
          <strong>개인정보</strong>
        </div>
        <br>
        <div>
          <label for="name" class="info-label">이름</label>
          <input type="text" id="name" placeholder="공백없이 입력하세요." name="name">
        </div>
        <div>
          <label for="phone" class="info-label">연락처</label>
          <input type="tel" id="phone" name="phone">
        </div>
      </div>
      <br>
      <div>
        <strong>지원 분야</strong>
      </div>
      <br>
      <div class="position">
        <div>
          <input type="radio" id="webpublishing" name="position" value="webpublishing">
          <label for="webpublishing">웹 퍼블리싱</label>
        </div>
        <div>
          <input type="radio" id="webfrontend" name="position" value="webfrontend">
          <label for="webfrontend">웹 프론트엔드</label>
        </div>
        <div>
          <input type="radio" id="mobileapp" name="position" value="mobileapp">
          <label for="mobileapp">모바일앱</label>
        </div>
      </div>
      <br>
      <div>
        <div>
          <strong>지원동기</strong>
        </div>
        <br>
        <div>
          <textarea name="motivation" cols="70" rows="5"></textarea>
        </div>
        <div>
          <button type="submit">접수하기</button>
          <button type="reset">다시쓰기</button>
        </div>
      </div>
    </form>
  </div>
</body>

</html>
