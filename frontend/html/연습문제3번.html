<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
        width: 320px;
        margin: 0 auto;
      }
      .container div {
        background-color: gray;
        width: 80px;
        height: 50px;
      }
      a {
        text-decoration: none;
        color: #000;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
      }
      .container div:hover {
        background-color: #000;
      }
      .container div:hover a {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div><a href="#">메뉴1</a></div>
      <div><a href="#">메뉴2</a></div>
      <div><a href="#">메뉴3</a></div>
      <div><a href="#">메뉴4</a></div>
    </div>
  </body>
</html>
