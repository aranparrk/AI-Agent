<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    p {
      display: inline-flex;
      width: 300px;
      height: 80px;
      background-color: royalblue;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <!-- 블럭(Block) 타입의 요소 : 해당 라인의 너비를 차지, p, div, h1~6, ul, ol -->
  <p>Box1</p>
  <p>Box2</p>
  <p>Box3</p>
  <!-- 인라인(Inline) 타입의 요소 : 요소의 내용(content)만큼만 차지, span, input -->
  
</body>
</html>
