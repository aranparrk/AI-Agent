<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .linear-gd-box {
        width: 300px;
        height: 200px;
        background-image: linear-gradient(to bottom, black, skyblue);
        border: 1px solid black;
      }
      .radial-gd-box {
        width: 300px;
        height: 200px;
        background-image: radial-gradient(circle, black, skyblue);
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <div class="linear-gd-box"></div>
    <div class="radial-gd-box"></div>
  </body>
</html>
