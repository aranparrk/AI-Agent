<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 
    아래 조건을 만족하는 .box 요소를 만들어 보세요.
    - 너비 100px, 높이 100px, 배경색 tomato
    - position: relative 사용
    - 원래 위치에서 오른쪽으로 50px, 아래로 30px 이동 
    -->
    <style>
      .box {
        width: 100px;
        height: 100px;
        background-color: tomato;
        position: relative;
        left: 50px;
        top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
