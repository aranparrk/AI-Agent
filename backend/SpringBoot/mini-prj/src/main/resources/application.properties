spring.application.name=mini-prj
server.port=8111

spring.datasource.url=jdbc:mysql://localhost:3306/mini_ai_prj?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

jwt.secret=${JWT_SECRET}
jwt.access-exp-ms=3600000
jwt.refresh-exp-ms=604800000

# application.properties — 카카오 (키는 환경변수 권장, 깃에 올리지 않기)
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.client-secret=${KAKAO_CLIENT_SECRET}
kakao.redirect-uri=http://localhost:3000/oauth/kakao